services:
  app:
    container_name: traefik-dashboard
    image: ghcr.io/your-org/traefik-dashboard:latest
    labels:
      traefik.enable: true
      traefik.http.routers.yourname.entryPoints: https
      traefik.http.routers.yourname.rule: Host(`dashboard.example.com`)
      traefik.http.routers.yourname.middlewares: auth@file
    env_file:
      - ../.env
    networks:
      - traefik-net
    restart: always

networks:
  traefik-net:
    external: true
